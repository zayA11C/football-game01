<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GTA Prototype</title>
<style>
body { margin:0; overflow:hidden; }
#ui{
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  background:rgba(0,0,0,0.5);
  padding:10px;
}
</style>
</head>
<body>

<div id="ui">
🎮 GTA PROTOTYPE<br>
WASD = bouger | SHIFT = courir | E = voiture
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

// ================= RENDERER =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,5);
scene.add(light);

// ================= GROUND =================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshLambertMaterial({color:0x2ecc71})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ================= CITY =================
let buildings = [];

for(let i=0;i<60;i++){
  let b = new THREE.Mesh(
    new THREE.BoxGeometry(
      Math.random()*5+2,
      Math.random()*20+5,
      Math.random()*5+2
    ),
    new THREE.MeshLambertMaterial({color:0x888888})
  );

  b.position.set(
    (Math.random()-0.5)*200,
    0,
    (Math.random()-0.5)*200
  );

  b.position.y = b.geometry.parameters.height/2;
  scene.add(b);
  buildings.push(b);
}

// ================= PLAYER =================
const player = new THREE.Group();

// corps
const body = new THREE.Mesh(
  new THREE.BoxGeometry(1,2,0.5),
  new THREE.MeshLambertMaterial({color:0x1565c0})
);
body.position.y = 1;
player.add(body);

// tête
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.4,16,16),
  new THREE.MeshLambertMaterial({color:0xffcc99})
);
head.position.y = 2.3;
player.add(head);

scene.add(player);

// ================= CAR =================
let car = new THREE.Mesh(
  new THREE.BoxGeometry(2,1,4),
  new THREE.MeshLambertMaterial({color:0xff0000})
);
car.position.set(5,0.5,5);
scene.add(car);

let inCar = false;

// ================= NPC =================
let npcs = [];

for(let i=0;i<10;i++){
  let npc = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.5,1),
    new THREE.MeshLambertMaterial({color:0xffff00})
  );

  npc.position.set(
    (Math.random()-0.5)*100,
    1,
    (Math.random()-0.5)*100
  );

  scene.add(npc);
  npcs.push(npc);
}

// ================= INPUT =================
let keys = {};
document.addEventListener("keydown", e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);

// ================= CAMERA =================
let camAngle = 0;
document.addEventListener("mousemove",(e)=>{
  camAngle += e.movementX * 0.002;
});

// ================= MOVE PLAYER =================
function movePlayer(){
  let speed = keys["shift"] ? 0.25 : 0.12;

  let fx = Math.sin(camAngle);
  let fz = Math.cos(camAngle);

  let rx = Math.sin(camAngle + Math.PI/2);
  let rz = Math.cos(camAngle + Math.PI/2);

  if(keys["w"]){
    player.position.x += fx * speed;
    player.position.z += fz * speed;
  }
  if(keys["s"]){
    player.position.x -= fx * speed;
    player.position.z -= fz * speed;
  }
  if(keys["a"]){
    player.position.x -= rx * speed;
    player.position.z -= rz * speed;
  }
  if(keys["d"]){
    player.position.x += rx * speed;
    player.position.z += rz * speed;
  }

  player.rotation.y = camAngle;
}

// ================= CAR SYSTEM =================
function driveCar(){
  let speed = 0.3;

  if(keys["w"]) car.position.z -= Math.cos(camAngle)*speed;
  if(keys["s"]) car.position.z += Math.cos(camAngle)*speed;
  if(keys["a"]) car.position.x -= Math.sin(camAngle)*speed;
  if(keys["d"]) car.position.x += Math.sin(camAngle)*speed;

  camera.position.x = car.position.x - Math.sin(camAngle)*6;
  camera.position.z = car.position.z - Math.cos(camAngle)*6;
  camera.position.y = 3;
  camera.lookAt(car.position);
}

// ================= INTERACT =================
document.addEventListener("keydown", e=>{
  if(e.key.toLowerCase()==="e"){
    let dist = player.position.distanceTo(car.position);
    if(dist < 3){
      inCar = !inCar;
    }
  }
});

// ================= CAMERA FOLLOW =================
function updateCamera(){
  let target = inCar ? car : player;

  let dist = 6;

  camera.position.x = target.position.x - Math.sin(camAngle)*dist;
  camera.position.z = target.position.z - Math.cos(camAngle)*dist;
  camera.position.y = target.position.y + 3;

  camera.lookAt(target.position);
}

// ================= LOOP =================
function animate(){
  requestAnimationFrame(animate);

  if(!inCar){
    movePlayer();
  } else {
    driveCar();
  }

  updateCamera();
  renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
