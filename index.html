<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football Simple ⚽</title>

<style>
body{
margin:0;
overflow:hidden;
background:#1b5e20;
}
canvas{
display:block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// plein écran
function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// ⚽ joueur
let player = {x:100,y:200};

// ⚽ ennemis
let enemies = [
{x:500,y:200},
{x:600,y:300}
];

// ⚽ balle
let ball = {x:140,y:200};

// contrôle
let keys = {};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🥅 cage (but)
function goal(){
ctx.fillStyle="white";
ctx.fillRect(canvas.width-30,canvas.height/2-100,20,200);
}

// 🎮 update
function update(){

// joueur move
if(keys["ArrowUp"]) player.y-=5;
if(keys["ArrowDown"]) player.y+=5;
if(keys["ArrowLeft"]) player.x-=5;
if(keys["ArrowRight"]) player.x+=5;

// balle suit joueur
ball.x = player.x + 15;
ball.y = player.y + 15;

// ennemis suivent balle
enemies.forEach(e=>{
if(e.x < ball.x) e.x += 2;
if(e.x > ball.x) e.x -= 2;
if(e.y < ball.y) e.y += 2;
if(e.y > ball.y) e.y -= 2;
});

draw();
requestAnimationFrame(update);
}

// 🎨 joueur style bonhomme
function drawPlayer(x,y,color){

// tête
ctx.fillStyle="#ffcc80";
ctx.beginPath();
ctx.arc(x,y,8,0,Math.PI*2);
ctx.fill();

// corps
ctx.fillStyle=color;
ctx.fillRect(x-6,y+8,12,20);

// jambes
ctx.fillStyle="#222";
ctx.fillRect(x-6,y+28,5,10);
ctx.fillRect(x+1,y+28,5,10);
}

// 🎨 draw
function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

// terrain
ctx.fillStyle="#2e7d32";
ctx.fillRect(0,0,canvas.width,canvas.height);

// cage
goal();

// joueur
drawPlayer(player.x,player.y,"blue");

// ennemis
enemies.forEach(e=>{
drawPlayer(e.x,e.y,"red");
});

// balle
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,6,0,Math.PI*2);
ctx.fill();

// ligne terrain
ctx.strokeStyle="white";
ctx.beginPath();
ctx.moveTo(canvas.width/2,0);
ctx.lineTo(canvas.width/2,canvas.height);
ctx.stroke();

}

update();
</script>

</body>
</html>
