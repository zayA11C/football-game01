<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Boat Taxi 🚤</title>

<style>
body{
margin:0;
overflow:hidden;
background:#0b3d91;
font-family:Arial;
}

canvas{
display:block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🚤 bateau joueur
let boat={
x:200,
y:200,
speed:4
};

// 👤 client
let client={
x:500,
y:300,
taken:false
};

// 🎯 destination
let dest={
x:800,
y:200
};

// 💰 score
let score=0;

// clavier
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🎮 update
function update(){

// mouvement bateau
if(keys["ArrowUp"]) boat.y-=boat.speed;
if(keys["ArrowDown"]) boat.y+=boat.speed;
if(keys["ArrowLeft"]) boat.x-=boat.speed;
if(keys["ArrowRight"]) boat.x+=boat.speed;

// prendre client
if(!client.taken && dist(boat,client)<30){
client.taken=true;
}

// transporter client vers destination
if(client.taken){
client.x = boat.x;
client.y = boat.y;
}

// livrer client
if(client.taken && dist(boat,dest)<40){
score++;
reset();
}

draw();
requestAnimationFrame(update);
}

// 🔁 reset
function reset(){

boat.x=200;
boat.y=200;

client.x=Math.random()*c.width;
client.y=Math.random()*c.height;
client.taken=false;

dest.x=Math.random()*c.width;
dest.y=Math.random()*c.height;
}

// 📏 distance
function dist(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}

// 🌊 map
function map(){

// eau
ctx.fillStyle="#1e88e5";
ctx.fillRect(0,0,c.width,c.height);

// île client
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(client.x,client.y,10,0,Math.PI*2);
ctx.fill();

// île destination
ctx.fillStyle="lime";
ctx.beginPath();
ctx.arc(dest.x,dest.y,15,0,Math.PI*2);
ctx.fill();
}

// 🚤 bateau
function drawBoat(){

ctx.fillStyle="white";
ctx.fillRect(boat.x,boat.y,20,20);
}

// 🎨 draw
function draw(){

map();
drawBoat();

// UI
ctx.fillStyle="white";
ctx.font="24px Arial";
ctx.fillText("Score: "+score,20,40);

ctx.font="16px Arial";
ctx.fillText("Arrow keys = move | pick client (yellow) → deliver (green)",20,70);
}

update();
</script>

</body>
</html>
