<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>3rd Person Game</title>
<style>
body { margin:0; overflow:hidden; }
#ui{
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  background:rgba(0,0,0,0.5);
  padding:10px;
}
</style>
</head>
<body>

<div id="ui">
🎮 GTA-LIKE TEST<br>
WASD = bouger | Souris = caméra
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

// ================= RENDERER =================
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,5);
scene.add(light);

// ================= GROUND =================
const groundGeo = new THREE.PlaneGeometry(200,200);
const groundMat = new THREE.MeshBasicMaterial({color:0x2ecc71});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ================= PLAYER =================
const playerGeo = new THREE.BoxGeometry(1,2,1);
const playerMat = new THREE.MeshBasicMaterial({color:0xff0000});
const player = new THREE.Mesh(playerGeo, playerMat);
player.position.y = 1;
scene.add(player);

// ================= INPUT =================
let keys = {};
document.addEventListener("keydown", e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);

// ================= CAMERA CONTROL =================
let camAngle = 0;

// souris rotation
document.addEventListener("mousemove", (e)=>{
  camAngle += e.movementX * 0.002;
});

// ================= MOVE =================
function move(){
  let speed = 0.15;

  let forwardX = Math.sin(camAngle);
  let forwardZ = Math.cos(camAngle);

  let rightX = Math.sin(camAngle + Math.PI/2);
  let rightZ = Math.cos(camAngle + Math.PI/2);

  if(keys["w"]){
    player.position.x += forwardX * speed;
    player.position.z += forwardZ * speed;
  }
  if(keys["s"]){
    player.position.x -= forwardX * speed;
    player.position.z -= forwardZ * speed;
  }
  if(keys["a"]){
    player.position.x -= rightX * speed;
    player.position.z -= rightZ * speed;
  }
  if(keys["d"]){
    player.position.x += rightX * speed;
    player.position.z += rightZ * speed;
  }
}

// ================= CAMERA FOLLOW =================
function updateCamera(){
  let distance = 6;
  let height = 3;

  camera.position.x = player.position.x - Math.sin(camAngle) * distance;
  camera.position.z = player.position.z - Math.cos(camAngle) * distance;
  camera.position.y = player.position.y + height;

  camera.lookAt(player.position);
}

// ================= LOOP =================
function animate(){
  requestAnimationFrame(animate);

  move();
  updateCamera();

  renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
