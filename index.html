<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ball Rings Game ⚪</title>

<style>
body{
margin:0;
overflow:hidden;
background:#111;
}
canvas{
display:block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// ⚪ balle
let ball={
x:200,
y:200,
vx:3,
vy:2,
r:8
};

// 🔵 cercles
let rings=[];

// 💰 score
let score=0;

// 🎮 créer un cercle
function newRing(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:40,
color:"white",
passed:false
});
}

// init cercles
for(let i=0;i<5;i++) newRing();

// 🎮 update
function update(){

// mouvement balle
ball.x+=ball.vx;
ball.y+=ball.vy;

// rebond murs
if(ball.x<0 || ball.x>c.width) ball.vx*=-1;
if(ball.y<0 || ball.y>c.height) ball.vy*=-1;

// collision cercles
rings.forEach(r=>{

let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r && !r.passed){
r.passed=true;
r.color=randomColor();
score++;

// nouveau cercle après réussite
setTimeout(()=>{
rings.splice(rings.indexOf(r),1);
newRing();
},300);
}

});

draw();
requestAnimationFrame(update);
}

// 🌈 couleur random
function randomColor(){
return `hsl(${Math.random()*360},100%,60%)`;
}

// 🎨 draw
function draw(){

ctx.clearRect(0,0,c.width,c.height);

// cercles
rings.forEach(r=>{
ctx.strokeStyle=r.color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
});

// balle
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

// score
ctx.fillStyle="white";
ctx.font="30px Arial";
ctx.fillText("Score: "+score,20,40);

// info
ctx.font="16px Arial";
ctx.fillText("La balle traverse les cercles en continu ⚪🌈",20,70);
}

update();
</script>

</body>
</html>
