<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Football PRO ⚽</title>

<style>
body{margin:0;overflow:hidden;background:#0b3d1c;font-family:Arial;}
canvas{display:block;}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

// fullscreen
function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// ================= TEAMS =================
let teamA=[
{x:120,y:200},
{x:120,y:260},
{x:120,y:320}
];

let teamB=[
{x:700,y:200},
{x:700,y:260},
{x:700,y:320}
];

let selected=0;

// ================= BALL =================
let ball={
x:300,
y:200,
vx:0,
vy:0
};

let owner="A"; // A ou B ou "free"

// ================= SCORE =================
let scoreA=0;
let scoreB=0;

// ================= INPUT =================
let keys={};

document.addEventListener("keydown",e=>{

keys[e.code]=true;

// switch player
if(e.code==="KeyQ"){
selected=(selected+1)%teamA.length;
}

// SHOOT
if(e.code==="Space" && owner==="A"){
let p=teamA[selected];

ball.x=p.x;
ball.y=p.y;

ball.vx=12;
ball.vy=(Math.random()-0.5)*5;

owner="free";
}
});

document.addEventListener("keyup",e=>{
keys[e.code]=false;
});

// ================= COLLISION (RÉCUP BALL) =================
function checkBallTake(){

// TEAM A
teamA.forEach(p=>{
if(Math.hypot(p.x-ball.x,p.y-ball.y)<15){
owner="A";
selected=teamA.indexOf(p);
}
});

// TEAM B
teamB.forEach(p=>{
if(Math.hypot(p.x-ball.x,p.y-ball.y)<15){
owner="B";
}
});
}

// ================= UPDATE =================
function update(){

let p=teamA[selected];

// MOVE PLAYER
if(keys["ArrowUp"]) p.y-=5;
if(keys["ArrowDown"]) p.y+=5;
if(keys["ArrowLeft"]) p.x-=5;
if(keys["ArrowRight"]) p.x+=5;

// BALL FOLLOW PLAYER
if(owner==="A"){
ball.x += (p.x-ball.x)*0.25;
ball.y += (p.y-ball.y)*0.25;
}

// BALL PHYSICS
if(owner==="free"){
ball.x+=ball.vx;
ball.y+=ball.vy;

ball.vx*=0.98;
ball.vy*=0.98;
}

// TEAM B IA
teamB.forEach(e=>{
let dx=ball.x-e.x;
let dy=ball.y-e.y;

e.x+=dx*0.02;
e.y+=dy*0.02;
});

// TEAM B POSSESSION
if(owner==="B"){
ball.x+=(teamB[0].x-ball.x)*0.05;
ball.y+=(teamB[0].y-ball.y)*0.05;
}

// 🔥 BALL RECOVERY
checkBallTake();

// GOAL RIGHT
if(ball.x>c.width-30 &&
ball.y>c.height/2-100 &&
ball.y<c.height/2+100){
scoreA++;
reset();
}

// GOAL LEFT
if(ball.x<30 &&
ball.y>c.height/2-100 &&
ball.y<c.height/2+100){
scoreB++;
reset();
}

draw();
requestAnimationFrame(update);
}

// ================= RESET =================
function reset(){

teamA=[
{x:120,y:200},
{x:120,y:260},
{x:120,y:320}
];

teamB=[
{x:700,y:200},
{x:700,y:260},
{x:700,y:320}
];

ball.x=c.width/2;
ball.y=c.height/2;
ball.vx=0;
ball.vy=0;

owner="A";
}

// ================= FIELD =================
function field(){

ctx.fillStyle="#1f7a2e";
ctx.fillRect(0,0,c.width,c.height);

ctx.strokeStyle="white";

// center line
ctx.beginPath();
ctx.moveTo(c.width/2,0);
ctx.lineTo(c.width/2,c.height);
ctx.stroke();

// circle
ctx.beginPath();
ctx.arc(c.width/2,c.height/2,80,0,Math.PI*2);
ctx.stroke();

// goals
ctx.strokeRect(20,c.height/2-100,20,200);
ctx.strokeRect(c.width-40,c.height/2-100,20,200);
}

// ================= DRAW PLAYER =================
function drawPlayer(x,y,color){

ctx.fillStyle="#ffcc80";
ctx.beginPath();
ctx.arc(x,y,8,0,Math.PI*2);
ctx.fill();

ctx.fillStyle=color;
ctx.fillRect(x-6,y+8,12,20);
}

// ================= DRAW =================
function draw(){

field();

// team A
teamA.forEach((p,i)=>{
drawPlayer(p.x,p.y,i===selected?"blue":"#4fc3f7");
});

// team B
teamB.forEach(p=>{
drawPlayer(p.x,p.y,"red");
});

// ball
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,6,0,Math.PI*2);
ctx.fill();

// UI
ctx.fillStyle="white";
ctx.font="24px Arial";
ctx.fillText("TEAM A: "+scoreA,20,40);
ctx.fillText("TEAM B: "+scoreB,20,70);
ctx.fillText("Q = changer joueur | SPACE = tir | touche balle = récupération",20,100);
}

update();
</script>

</body>
</html>
