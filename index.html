<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Real Football ⚽</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #0b5d1e;
  font-family: Arial;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 🖥️ plein écran
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ⚽ joueur
let player = {x:150, y:200, speed:5, vx:0, vy:0};

// ⚽ balle réaliste
let ball = {x:200, y:200, vx:0, vy:0, friction:0.98};
let owned = true;

// 🤖 ennemis
let enemies = [
  {x:600,y:200},
  {x:650,y:350},
  {x:700,y:150}
];

// 🥅 but
let goal = {x:canvas.width-30, y:canvas.height/2-80, w:20, h:160};

let score = 0;

// 🎮 clavier
let keys = {};
document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);

// 🎨 terrain réaliste
function drawField(){

  ctx.fillStyle = "#1f7a2e";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;

  // ligne centrale
  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,canvas.height);
  ctx.stroke();

  // cercle
  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,80,0,Math.PI*2);
  ctx.stroke();

  // surface de but
  ctx.strokeRect(canvas.width-120,canvas.height/2-120,100,240);
}

// 👤 joueur humain
function drawPlayer(x,y,color){

  // tête
  ctx.fillStyle = "#ffd6a5";
  ctx.beginPath();
  ctx.arc(x,y,10,0,Math.PI*2);
  ctx.fill();

  // corps
  ctx.fillStyle = color;
  ctx.fillRect(x-7,y+10,14,25);

  // jambes
  ctx.fillStyle = "#222";
  ctx.fillRect(x-7,y+35,6,12);
  ctx.fillRect(x+1,y+35,6,12);
}

// ⚽ update physique
function update(){

  // mouvement joueur fluide
  if(keys["ArrowUp"]) player.vy = -player.speed;
  else if(keys["ArrowDown"]) player.vy = player.speed;
  else player.vy *= 0.8;

  if(keys["ArrowLeft"]) player.vx = -player.speed;
  else if(keys["ArrowRight"]) player.vx = player.speed;
  else player.vx *= 0.8;

  player.x += player.vx;
  player.y += player.vy;

  // ⚽ tirer
  if(keys[" "] && owned){
    owned = false;
    ball.vx = 10;
  }

  // balle suit joueur
  if(owned){
    ball.x = player.x;
    ball.y = player.y;
  } else {
    ball.x += ball.vx;
    ball.y += ball.vy;

    // friction réaliste
    ball.vx *= ball.friction;
    ball.vy *= ball.friction;
  }

  // 🤖 IA réaliste
  enemies.forEach(e=>{
    let dx = ball.x - e.x;
    let dy = ball.y - e.y;

    e.x += dx * 0.02;
    e.y += dy * 0.02;

    // prise de balle
    if(Math.hypot(e.x-ball.x,e.y-ball.y)<15){
      owned = false;
    }
  });

  // ⚽ but
  if(ball.x > canvas.width-30 &&
     ball.y > canvas.height/2-80 &&
     ball.y < canvas.height/2+80){

    score++;

    player.x = 150;
    player.y = canvas.height/2;

    ball.x = player.x;
    ball.y = player.y;

    ball.vx = 0;
    ball.vy = 0;

    owned = true;
  }

  draw();
  requestAnimationFrame(update);
}

// 🎨 dessin
function draw(){

  drawField();

  // joueur
  drawPlayer(player.x,player.y,"blue");

  // ennemis
  enemies.forEach(e=>{
    drawPlayer(e.x,e.y,"red");
  });

  // ⚽ balle réaliste
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,6,0,Math.PI*2);
  ctx.fill();

  // score
  ctx.fillStyle="white";
  ctx.font="30px Arial";
  ctx.fillText("Score: "+score,20,40);
}

update();
</script>

</body>
</html>
