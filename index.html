<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NEON PONG ULTIMATE ALL-IN-ONE</title>

<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial;touch-action:none;}
canvas{display:block}

/* MENU */
#menu{
position:absolute;inset:0;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
background:linear-gradient(45deg,#000,#111,#220033,#00ffff,#ff00ff);
background-size:400% 400%;
animation:bg 6s infinite alternate;
color:white;z-index:10;
}
@keyframes bg{0%{background-position:0% 50%}100%{background-position:100% 50%}}

button,select{padding:10px;margin-top:10px;border-radius:10px;border:none}

/* HUD */
#hud{position:absolute;top:10px;left:10px;color:white;display:none}

/* mobile */
#touchL,#touchR{
position:absolute;bottom:0;height:100px;width:50%;
}
#touchR{right:0}
#touchL{left:0}
</style>
</head>

<body>

<div id="menu">
<h1>🏓 NEON PONG ULTIMATE</h1>

<select id="mode">
<option value="arcade">Arcade</option>
<option value="pro">Pro</option>
<option value="chaos">Chaos+</option>
<option value="boss">Boss AI</option>
<option value="multi">Multi (mock)</option>
</select>

<button onclick="start()">PLAY</button>
</div>

<div id="hud">
Score: <span id="l">0</span> - <span id="r">0</span> | XP:<span id="xp">0</span> LVL:<span id="lv">1</span>
</div>

<div id="touchL"></div>
<div id="touchR"></div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);

// ===== STATE =====
let left,right,ball,particles=[],holes=[],lasers=[],powerups=[];
let scoreL=0,scoreR=0,xp=0,level=1;
let running=false,mode="arcade";
let shake=0,slow=1;

let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

// touch
let ty=0;
document.getElementById("touchL").ontouchmove=e=>ty=e.touches[0].clientY;

// ===== START =====
function start(){
mode=document.getElementById("mode").value;
document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";
init();
running=true;
loop();
}

// ===== INIT =====
function init(){
left={x:20,y:c.height/2-70,w:15,h:140,s:8};
right={x:c.width-35,y:c.height/2-70,w:15,h:140,s:8};

ball={x:c.width/2,y:c.height/2,vx:7,vy:3,r:8};

holes=[...Array(mode==="chaos"?3:1)].map(()=>({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:60
}));
}

// ===== EFFECTS =====
function boom(x,y){
for(let i=0;i<15;i++){
particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:40,h:Math.random()*360});
}
shake=10;
}

// ===== IA =====
function ai(){
if(mode==="multi") return;
let skill=mode==="boss"?0.35:0.15;
right.y+=(ball.y-right.h/2-right.y)*skill;
}

// ===== POWER =====
function spawnPower(){
if(Math.random()<0.01){
powerups.push({x:Math.random()*c.width,y:Math.random()*c.height,type:Math.random()>0.5?"slow":"laser"});
}
}

// ===== LASER =====
function shoot(){
lasers.push({x:left.x+20,y:left.y+60,vx:10});
}

// ===== LOOP =====
function loop(){
if(!running)return;
update();draw();requestAnimationFrame(loop);
}

// ===== UPDATE =====
function update(){

// PLAYER
if(keys["KeyW"]) left.y-=left.s;
if(keys["KeyS"]) left.y+=left.s;

// TOUCH
left.y+=(ty-left.y)*0.2;

// AI
ai();

// clamp
left.y=Math.max(0,Math.min(c.height-left.h,left.y));
right.y=Math.max(0,Math.min(c.height-right.h,right.y));

// chaos gravity
if(mode!=="arcade") ball.vy+=0.1;

// holes
for(let h of holes){
let dx=h.x-ball.x,dy=h.y-ball.y,d=Math.hypot(dx,dy);
if(d<h.r){ball.vx+=dx*0.02;ball.vy+=dy*0.02;}
}

// ball
ball.x+=ball.vx*slow;
ball.y+=ball.vy*slow;

// teleport
if(Math.random()<0.005&&mode!=="arcade"){
ball.x=Math.random()*c.width;
ball.y=Math.random()*c.height;
boom(ball.x,ball.y);
}

// walls
if(ball.y<0||ball.y>c.height){ball.vy*=-1;boom(ball.x,ball.y)}

// paddles
if(ball.x<left.x+left.w&&ball.y>left.y&&ball.y<left.y+left.h){
ball.vx*=-1;boom(ball.x,ball.y)
}
if(ball.x>right.x&&ball.y>right.y&&ball.y<right.y+right.h){
ball.vx*=-1;boom(ball.x,ball.y)
}

// score
if(ball.x<0){scoreR++;xp++;reset()}
if(ball.x>c.width){scoreL++;xp++;reset()}

// lvl
if(xp%10===0)level++;

// power
spawnPower();

// lasers
for(let l of lasers){
l.x+=l.vx;
if(l.x>right.x){scoreL+=2;boom(l.x,l.y);l.dead=true;}
}

// cleanup
lasers=lasers.filter(l=>!l.dead);

// slow toggle
if(mode==="boss"&&Math.random()<0.002)slow=slow===1?0.4:1;
}

// ===== RESET =====
function reset(){
ball.x=c.width/2;
ball.y=c.height/2;
ball.vx=(Math.random()>0.5?7:-7);
ball.vy=(Math.random()-0.5)*6;
}

// ===== DRAW =====
let hue=0;

function draw(){
hue+=3;

ctx.setTransform(1,0,0,1,(Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
shake*=0.9;

ctx.fillStyle=`hsl(${hue},80%,10%)`;
ctx.fillRect(-50,-50,c.width+100,c.height+100);

// holes
for(let h of holes){
ctx.beginPath();ctx.fillStyle="black";ctx.arc(h.x,h.y,h.r,0,6.28);ctx.fill();
}

// paddles
ctx.fillStyle="white";
ctx.fillRect(left.x,left.y,left.w,left.h);
ctx.fillRect(right.x,right.y,right.w,right.h);

// ball
ctx.beginPath();
ctx.fillStyle="cyan";
ctx.arc(ball.x,ball.y,ball.r,0,6.28);
ctx.fill();

// particles
for(let p of particles){
p.x+=p.vx;p.y+=p.vy;p.life--;
ctx.fillStyle=`hsl(${p.h},100%,60%)`;
ctx.fillRect(p.x,p.y,3,3);
}
particles=particles.filter(p=>p.life>0);

// lasers
for(let l of lasers){
ctx.fillStyle="red";
ctx.fillRect(l.x,l.y,10,3);
}

// HUD
document.getElementById("l").textContent=scoreL;
document.getElementById("r").textContent=scoreR;
document.getElementById("xp").textContent=xp;
document.getElementById("lv").textContent=level;
}
</script>

</body>
</html>
