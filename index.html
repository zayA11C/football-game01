<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Football Pro Full Screen ⚽</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
}
canvas {
  display: block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 🖥️ plein écran
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ⚽ joueur
let player = {x:100, y:200, speed:6};

// ⚽ balle
let ball = {x:120, y:200};
let owned = true;
let ballSpeedX = 0;

// 🤖 ennemis
let enemies = [
  {x:500,y:200},
  {x:600,y:300},
  {x:700,y:150}
];

// 🥅 but
let goal = {x:window.innerWidth-40, y:200, w:20, h:150};

let score = 0;

// 🎮 clavier
let keys = {};
document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);

// 🎨 terrain
function drawField(){
  ctx.fillStyle = "#1b5e20";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;

  // ligne centrale
  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,canvas.height);
  ctx.stroke();

  // cercle centre
  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,80,0,Math.PI*2);
  ctx.stroke();

  // surface de but
  ctx.strokeRect(canvas.width-120,canvas.height/2-100,100,200);
}

// 👤 joueur stylé
function drawPlayer(x,y,color){
  ctx.fillStyle = "#ffcc80";
  ctx.beginPath();
  ctx.arc(x,y,10,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = color;
  ctx.fillRect(x-6,y+10,12,25);
}

// 🔁 update
function update(){

  // mouvement joueur
  if(keys["ArrowUp"]) player.y -= player.speed;
  if(keys["ArrowDown"]) player.y += player.speed;
  if(keys["ArrowLeft"]) player.x -= player.speed;
  if(keys["ArrowRight"]) player.x += player.speed;

  // tir
  if(keys[" "] && owned){
    owned = false;
    ballSpeedX = 10;
  }

  // balle suit joueur
  if(owned){
    ball.x = player.x;
    ball.y = player.y;
  } else {
    ball.x += ballSpeedX;
  }

  // 🤖 ennemis suivent balle
  enemies.forEach(e=>{
    if(e.x < ball.x) e.x += 2.5;
    if(e.x > ball.x) e.x -= 2.5;
    if(e.y < ball.y) e.y += 2.5;
    if(e.y > ball.y) e.y -= 2.5;

    if(Math.hypot(e.x-ball.x,e.y-ball.y)<15){
      owned = false;
    }
  });

  // ⚽ but
  if(ball.x > canvas.width-40 &&
     ball.y > canvas.height/2-75 &&
     ball.y < canvas.height/2+75){
    score++;

    player.x = 100;
    player.y = canvas.height/2;

    ball.x = player.x;
    ball.y = player.y;

    owned = true;
    ballSpeedX = 0;
  }

  draw();
  requestAnimationFrame(update);
}

// 🎨 dessin
function draw(){

  drawField();

  // joueur
  drawPlayer(player.x,player.y,"blue");

  // ennemis
  enemies.forEach(e=>{
    drawPlayer(e.x,e.y,"red");
  });

  // balle
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,6,0,Math.PI*2);
  ctx.fill();

  // score
  ctx.fillStyle="white";
  ctx.font="30px Arial";
  ctx.fillText("Score: "+score,20,40);
}

update();
</script>

</body>
</html>
