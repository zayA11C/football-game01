<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

// ⚡ fond animation (jeu seulement)
let hue=0;

// ⚪ player
let ball={
x:200,
y:200,
r:12,
speed:5
};

// 🔵 rings
let rings=[];
let particles=[];

let score=0;
let running=false;

// input
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// START (NE CHANGE PAS TON BOUTON)
function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";

running=true;

// spawn rings
for(let i=0;i<15;i++) spawnRing();

loop();
}

// spawn
function spawnRing(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:40+Math.random()*25,
color:"white"
});
}

// 💥 explosion
function explosion(x,y){
for(let i=0;i<15;i++){
particles.push({
x,
y,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:40
});
}
}

// LOOP
function loop(){
if(!running) return;

update();
draw();
requestAnimationFrame(loop);
}

// UPDATE
function update(){

hue+=0.8;

// move
if(keys["ArrowUp"]) ball.y-=ball.speed;
if(keys["ArrowDown"]) ball.y+=ball.speed;
if(keys["ArrowLeft"]) ball.x-=ball.speed;
if(keys["ArrowRight"]) ball.x+=ball.speed;

// limit
ball.x=Math.max(0,Math.min(c.width,ball.x));
ball.y=Math.max(0,Math.min(c.height,ball.y));

// rings
for(let i=rings.length-1;i>=0;i--){
let r=rings[i];

let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r){

// 💥 EFFECT TOUCH
explosion(ball.x,ball.y);

score++;

rings.splice(i,1);
spawnRing();
}
}

// particles
for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.life--;

if(p.life<=0) particles.splice(i,1);
}

document.getElementById("score").innerText=score;
}

// DRAW
function draw(){

// 🌈 fond animé UNIQUEMENT EN JEU
if(running){
ctx.fillStyle=`hsl(${hue},60%,10%)`;
ctx.fillRect(0,0,c.width,c.height);
}

// rings
rings.forEach(r=>{
ctx.strokeStyle="white";
ctx.lineWidth=4;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
});

// particles
particles.forEach(p=>{
ctx.fillStyle="rgba(255,255,255,0.7)";
ctx.fillRect(p.x,p.y,3,3);
});

// ⚪ PLAYER (VERT + GLOW VIOLET)
ctx.shadowBlur=25;
ctx.shadowColor="purple";

ctx.fillStyle="#00ff88";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
}

</script>
