<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ULTRA GEOMETRY RINGS ⚡</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:#000;
}

/* CANVAS */
canvas{display:block;}

/* MENU */
#menu{
position:absolute;
top:0;left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
}

button{
padding:12px 20px;
margin:8px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#7b2cbf;
color:white;
}

input[type="checkbox"]{
transform:scale(1.3);
}

label{
font-size:16px;
margin:5px;
}

/* HUD */
#hud{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:5;
display:none;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">

<h1>⚡ ULTRA RINGS GAME</h1>

<button onclick="startGame()">▶ START</button>

<h3>OPTIONS</h3>

<label><input type="checkbox" id="sound"> 🔊 Sons</label>
<label><input type="checkbox" id="explosion"> 💥 Explosion</label>
<label><input type="checkbox" id="magnet"> 🧲 Aimant</label>
<label><input type="checkbox" id="hardcore"> 🔴 Hardcore</label>

<br>

<button onclick="resetScore()">🏆 Reset Leaderboard</button>

<h3>Best Score: <span id="best">0</span></h3>

</div>

<!-- HUD -->
<div id="hud">
Score: <span id="score">0</span> |
Speed: <span id="speed">1</span>
</div>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🎮 STATE
let running=false;

// ⚪ player
let ball={x:200,y:200,r:10,speed:5};

// 🔵 rings
let rings=[];
let particles=[];

// 💰 stats
let score=0;
let speed=1;

// options
let opt={
sound:false,
explosion:false,
magnet:false,
hardcore:false
};

// 🏆 leaderboard
let best=localStorage.getItem("best")||0;
document.getElementById("best").innerText=best;

// ---------------- MENU ----------------
function startGame(){
opt.sound=document.getElementById("sound").checked;
opt.explosion=document.getElementById("explosion").checked;
opt.magnet=document.getElementById("magnet").checked;
opt.hardcore=document.getElementById("hardcore").checked;

document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";

running=true;
init();
loop();
}

// reset leaderboard
function resetScore(){
localStorage.setItem("best",0);
document.getElementById("best").innerText=0;
}

// ---------------- INIT ----------------
function init(){
rings=[];
for(let i=0;i<15;i++) spawnRing();
score=0;
speed=1;
}

// ---------------- RINGS ----------------
function spawnRing(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:40+Math.random()*20,
vx:(Math.random()-0.5)*opt.hardcore*2,
vy:(Math.random()-0.5)*opt.hardcore*2,
color:"white"
});
}

// ---------------- SOUND ----------------
function beep(){
if(!opt.sound) return;
let ctxAudio=new (window.AudioContext||window.webkitAudioContext)();
let o=ctxAudio.createOscillator();
o.type="sine";
o.frequency.value=600;
o.connect(ctxAudio.destination);
o.start();
o.stop(ctxAudio.currentTime+0.05);
}

// ---------------- EXPLOSION ----------------
function explode(x,y,color){
if(!opt.explosion) return;

for(let i=0;i<12;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:40,
color
});
}
}

// ---------------- LOOP ----------------
function loop(){
if(!running) return;

update();
draw();
requestAnimationFrame(loop);
}

// ---------------- UPDATE ----------------
function update(){

// move
document.onkeydown=e=>{
if(e.code==="ArrowUp") ball.y-=ball.speed*speed;
if(e.code==="ArrowDown") ball.y+=ball.speed*speed;
if(e.code==="ArrowLeft") ball.x-=ball.speed*speed;
if(e.code==="ArrowRight") ball.x+=ball.speed*speed;
};

// magnet
if(opt.magnet){
rings.forEach(r=>{
let dx=ball.x-r.x;
let dy=ball.y-r.y;
r.x+=dx*0.02;
r.y+=dy*0.02;
});
}

// hardcore movement
if(opt.hardcore){
rings.forEach(r=>{
r.x+=r.vx;
r.y+=r.vy;
});
}

// collision
for(let i=rings.length-1;i>=0;i--){
let r=rings[i];
let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r){
score+=1;
speed+=0.05;

beep();
explode(ball.x,ball.y,r.color);

rings.splice(i,1);
spawnRing();
}
}

// particles
for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.life--;
if(p.life<=0) particles.splice(i,1);
}

// save best
if(score>best){
best=score;
localStorage.setItem("best",best);
document.getElementById("best").innerText=best;
}

// UI
document.getElementById("score").innerText=score;
document.getElementById("speed").innerText=speed.toFixed(2);
}

// ---------------- DRAW ----------------
function draw(){

ctx.fillStyle="black";
ctx.fillRect(0,0,c.width,c.height);

// rings
rings.forEach(r=>{
ctx.strokeStyle=r.color;
ctx.lineWidth=4;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
});

// particles
particles.forEach(p=>{
ctx.fillStyle=p.color;
ctx.globalAlpha=p.life/40;
ctx.fillRect(p.x,p.y,4,4);
ctx.globalAlpha=1;
});

// player
ctx.fillStyle="#00ff88";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();
}
</script>

</body>
</html>
