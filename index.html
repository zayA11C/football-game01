<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Farm Game</title>
<style>
body {
    font-family: Arial;
    background: #e6f7e6;
    text-align: center;
}
.container {
    background: white;
    padding: 20px;
    margin: 20px auto;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}
button {
    margin: 5px;
    padding: 10px;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>🌾 FARMING GAME</h1>

<div class="container">
    <p id="status"></p>

    <button onclick="action('planter')">🌱 Planter</button>
    <button onclick="action('recolter')">🌾 Récolter</button>
    <button onclick="action('vendre')">🏪 Vendre</button>
    <button onclick="action('elever')">🐔 Élever</button>
    <button onclick="action('ameliorer')">🔧 Améliorer</button>
    <button onclick="nextDay()">⏭️ Jour suivant</button>
</div>

<script>
let state = {
    or: 10,
    ble: 0,
    champs: 1,
    poules: 0,
    jour: 1,
    actions: 3,
    bonus: 1
};

function event() {
    let events = [
        ["🌧️ Pluie", 1.5],
        ["🐀 Rats", 0.9],
        ["🧑‍🌾 Marchand", 1.2],
        ["☀️ Normal", 1.0]
    ];
    let e = events[Math.floor(Math.random() * events.length)];
    state.bonus = e[1];
    alert("ÉVÉNEMENT: " + e[0]);
}

function update() {
    document.getElementById("status").innerHTML =
        "Jour: " + state.jour + "<br>" +
        "Or: " + state.or + "<br>" +
        "Blé: " + state.ble + "<br>" +
        "Champs: " + state.champs + "<br>" +
        "Poules: " + state.poules + "<br>" +
        "Actions restantes: " + state.actions;
}

function action(type) {
    if (state.actions <= 0) {
        alert("Plus d'actions aujourd'hui !");
        return;
    }

    if (type === "planter") {
        state.ble += state.champs * 2;
    }

    if (type === "recolter") {
        state.ble += Math.floor(state.champs * 2 * state.bonus);
    }

    if (type === "vendre") {
        state.or += Math.floor(state.ble / 2);
        state.ble = 0;
    }

    if (type === "elever") {
        state.poules += 1;
    }

    if (type === "ameliorer") {
        if (state.or >= 20) {
            state.or -= 20;
            state.champs += 1;
        } else {
            alert("Pas assez d'or !");
        }
    }

    state.actions--;
    update();
}

function nextDay() {
    state.jour++;
    state.actions = 3;
    event();

    state.ble += state.poules * 2;

    update();
}

event();
update();
</script>

</body>
</html>
