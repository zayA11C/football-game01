<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ultra Neon Rings ⚡</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

canvas{display:block;}

/* MENU */
#menu{
position:absolute;
top:0;left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
background:linear-gradient(45deg,#0f0c29,#302b63,#ff00cc,#00ffcc);
background-size:400% 400%;
animation:moveBg 6s infinite alternate;
}

@keyframes moveBg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

button{
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00ffcc;
color:black;
margin-top:10px;
}

/* HUD */
#hud{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:5;
display:none;
}
</style>
</head>

<body>

<div id="menu">
<h1>⚡ NEON RINGS ⚡</h1>
<button onclick="startGame()">START</button>
<p>Arrow keys = move | Touch rings ⚪</p>
</div>

<div id="hud">
Score: <span id="score">0</span>
</div>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🌈 background animation
let hue=0;

// ⚪ player (VERT + VIOLET GLOW)
let ball={
x:200,
y:200,
r:12,
speed:5
};

// 🔵 rings
let rings=[];
let particles=[];

let score=0;
let running=false;

// input
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// START
function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";
running=true;

for(let i=0;i<18;i++) spawnRing();

loop();
}

// spawn ring
function spawnRing(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:40+Math.random()*25,
color:"white"
});
}

// 💥 explosion
function explosion(x,y){
for(let i=0;i<18;i++){
particles.push({
x,
y,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:40
});
}
}

// LOOP
function loop(){
if(!running) return;

update();
draw();
requestAnimationFrame(loop);
}

// UPDATE
function update(){

hue+=1;

// move ball
if(keys["ArrowUp"]) ball.y-=ball.speed;
if(keys["ArrowDown"]) ball.y+=ball.speed;
if(keys["ArrowLeft"]) ball.x-=ball.speed;
if(keys["ArrowRight"]) ball.x+=ball.speed;

// limits
ball.x=Math.max(0,Math.min(c.width,ball.x));
ball.y=Math.max(0,Math.min(c.height,ball.y));

// rings
for(let i=rings.length-1;i>=0;i--){
let r=rings[i];

let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r){

// 💥 effect touch
explosion(ball.x,ball.y);

score+=1;

rings.splice(i,1);
spawnRing();
}
}

// particles
for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.life--;

if(p.life<=0) particles.splice(i,1);
}

document.getElementById("score").innerText=score;
}

// DRAW
function draw(){

// 🌈 animated background
ctx.fillStyle=`hsl(${hue},60%,10%)`;
ctx.fillRect(0,0,c.width,c.height);

// rings
rings.forEach(r=>{
ctx.strokeStyle="white";
ctx.lineWidth=4;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
});

// particles
particles.forEach(p=>{
ctx.fillStyle="rgba(255,255,255,0.7)";
ctx.fillRect(p.x,p.y,3,3);
});

// ⚪ PLAYER (VERT + VIOLET GLOW)
ctx.shadowBlur=20;
ctx.shadowColor="purple";

ctx.fillStyle="#00ff88";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
}

</script>

</body>
</html>
