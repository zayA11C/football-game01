<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ping Pong Neon AI</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

/* ===== MENU ===== */
#menu{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
color:white;
background:linear-gradient(45deg,#000,#111,#222);
}

#menu h1{
font-size:40px;
margin-bottom:20px;
}

button{
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00ffcc;
margin-top:10px;
}

/* ===== HUD ===== */
#hud{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:20px;
z-index:5;
display:none;
}

/* ===== SCOREBOARD FIN ===== */
#scoreBoard{
position:absolute;
inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
background:rgba(0,0,0,0.85);
z-index:20;
}

#scoreBoard h2{
font-size:40px;
}

canvas{display:block;}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
<h1>🏓 NEON PING PONG</h1>
<button onclick="startGame()">JOUER</button>
</div>

<!-- HUD -->
<div id="hud">
Score : <span id="sL">0</span> - <span id="sR">0</span>
</div>

<!-- SCOREBOARD -->
<div id="scoreBoard">
<h2 id="result"></h2>
<button onclick="restart()">Rejouer</button>
</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

function resize(){
c.width=innerWidth;
c.height=innerHeight;
}
resize();
addEventListener("resize",resize);

// ===== GAME STATE =====
let left,right,ball;
let scoreL=0, scoreR=0;
let running=false;

// ===== INPUT =====
let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

// ===== MENU =====
function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";

init();
running=true;
loop();
}

// ===== INIT =====
function init(){
left={x:20,y:c.height/2-70,w:15,h:140,s:8};
right={x:c.width-35,y:c.height/2-70,w:15,h:140,s:7};

ball={x:c.width/2,y:c.height/2,vx:7,vy:3,r:8};

scoreL=0;
scoreR=0;
updateHUD();
}

// ===== IA =====
function ai(){
let target = ball.y - right.h/2;
right.y += (target - right.y)*0.12;
right.y=Math.max(0,Math.min(c.height-right.h,right.y));
}

// ===== LOOP =====
function loop(){
if(!running) return;

update();
draw();
requestAnimationFrame(loop);
}

// ===== UPDATE =====
function update(){

// PLAYER
if(keys["KeyW"]) left.y-=left.s;
if(keys["KeyS"]) left.y+=left.s;
left.y=Math.max(0,Math.min(c.height-left.h,left.y));

// IA
ai();

// BALL
ball.x+=ball.vx;
ball.y+=ball.vy;

// WALL
if(ball.y<0||ball.y>c.height) ball.vy*=-1;

// COLLISION LEFT
if(ball.x-ball.r<left.x+left.w &&
ball.y>left.y && ball.y<left.y+left.h){
ball.vx*=-1;
ball.x=left.x+left.w+ball.r;
}

// COLLISION RIGHT
if(ball.x+ball.r>right.x &&
ball.y>right.y && ball.y<right.y+right.h){
ball.vx*=-1;
ball.x=right.x-ball.r;
}

// SCORE
if(ball.x<0){
scoreR++;
reset();
}

if(ball.x>c.width){
scoreL++;
reset();
}

updateHUD();

// WIN
if(scoreL>=5 || scoreR>=5){
endGame();
}
}

// ===== RESET BALL =====
function reset(){
ball.x=c.width/2;
ball.y=c.height/2;
ball.vx=(Math.random()>0.5?7:-7);
ball.vy=(Math.random()-0.5)*6;
}

// ===== HUD =====
function updateHUD(){
document.getElementById("sL").textContent=scoreL;
document.getElementById("sR").textContent=scoreR;
}

// ===== END GAME =====
function endGame(){
running=false;

document.getElementById("scoreBoard").style.display="flex";

document.getElementById("result").textContent =
(scoreL>scoreR) ? "🏆 TU GAGNES !" : "🤖 IA GAGNE !";
}

// ===== RESTART =====
function restart(){
document.getElementById("scoreBoard").style.display="none";
init();
running=true;
loop();
}

// ===== DRAW (FOND ANIMÉ) =====
let hue=0;

function draw(){

hue+=2;

// fond animé couleur
ctx.fillStyle=`hsl(${hue},80%,10%)`;
ctx.fillRect(0,0,c.width,c.height);

// ligne centrale
ctx.strokeStyle="white";
ctx.setLineDash([10,10]);
ctx.beginPath();
ctx.moveTo(c.width/2,0);
ctx.lineTo(c.width/2,c.height);
ctx.stroke();
ctx.setLineDash([]);

// paddles
ctx.fillStyle="white";
ctx.fillRect(left.x,left.y,left.w,left.h);
ctx.fillRect(right.x,right.y,right.w,right.h);

// balle glow
ctx.shadowBlur=20;
ctx.shadowColor="cyan";

ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
}

</script>
</body>
</html>
