<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ultra Ping Pong AI 🏓⚡</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

/* ===== MENU ===== */
#menu{
position:absolute;
top:0;left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
background:linear-gradient(45deg,#0f0c29,#302b63,#ff00cc,#00ffcc);
background-size:400% 400%;
animation:moveBg 6s infinite alternate;
}

@keyframes moveBg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

button{
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00ffcc;
color:black;
margin-top:10px;
}

/* HUD */
#hud{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:5;
display:none;
}

canvas{display:block;}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
<h1>🏓 ULTRA PING PONG AI ⚡</h1>
<button onclick="startGame()">START</button>
<p>W/S = gauche | Touch = mobile | AI droite 🤖</p>
</div>

<!-- HUD -->
<div id="hud">
Score: <span id="scoreL">0</span> - <span id="scoreR">0</span>
</div>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// ================= GAME =================
let running=false;

// paddles
let left,right;

// ball
let ball;

// score
let scoreL=0;
let scoreR=0;

// input
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🔊 sound (simple ping)
function beep(freq=600){
let ctxA=new (window.AudioContext||window.webkitAudioContext)();
let o=ctxA.createOscillator();
o.type="square";
o.frequency.value=freq;
o.connect(ctxA.destination);
o.start();
o.stop(ctxA.currentTime+0.05);
}

// ================= START =================
function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";

init();
running=true;
loop();
}

// ================= INIT =================
function init(){

left={
x:20,
y:c.height/2-70,
w:15,
h:140,
speed:7
};

right={
x:c.width-35,
y:c.height/2-70,
w:15,
h:140,
speed:6
};

ball={
x:c.width/2,
y:c.height/2,
vx:6,
vy:3,
r:8
};

scoreL=0;
scoreR=0;
}

// ================= AI =================
function ai(){
let target=ball.y - right.h/2;
right.y += (target - right.y)*0.08; // smooth AI
}

// ================= TOUCH MOBILE =================
document.addEventListener("touchmove",e=>{
let t=e.touches[0];
left.y=t.clientY-left.h/2;
});

// ================= LOOP =================
function loop(){
if(!running) return;

update();
draw();
requestAnimationFrame(loop);
}

// ================= UPDATE =================
function update(){

// left control (keyboard)
if(keys["KeyW"]) left.y-=left.speed;
if(keys["KeyS"]) left.y+=left.speed;

// AI right
ai();

// limits
left.y=Math.max(0,Math.min(c.height-left.h,left.y));
right.y=Math.max(0,Math.min(c.height-right.h,right.y));

// ⚡ SPEED INCREASE (addiction)
ball.vx *= 1.0005;
ball.vy *= 1.0005;

// move ball
ball.x+=ball.vx;
ball.y+=ball.vy;

// bounce top/bottom
if(ball.y<0 || ball.y>c.height) ball.vy*=-1;

// ================= SPIN EFFECT 🎯 =================
// quand la balle touche raquette → angle change
function spin(paddle){
let diff = ball.y - (paddle.y + paddle.h/2);
ball.vy += diff*0.02; // courbe
}

// left collision
if(ball.x-ball.r<left.x+left.w &&
ball.y>left.y &&
ball.y<left.y+left.h){

ball.vx*=-1;
spin(left);
ball.x=left.x+left.w+ball.r;
beep(500);
}

// right collision
if(ball.x+ball.r>right.x &&
ball.y>right.y &&
ball.y<right.y+right.h){

ball.vx*=-1;
spin(right);
ball.x=right.x-ball.r;
beep(700);
}

// score
if(ball.x<0){
scoreR++;
reset();
beep(200);
}

if(ball.x>c.width){
scoreL++;
reset();
beep(200);
}

// HUD
document.getElementById("scoreL").innerText=scoreL;
document.getElementById("scoreR").innerText=scoreR;
}

// ================= RESET =================
function reset(){
ball.x=c.width/2;
ball.y=c.height/2;
ball.vx=(Math.random()>0.5?6:-6);
ball.vy=(Math.random()-0.5)*6;
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="black";
ctx.fillRect(0,0,c.width,c.height);

// center line
ctx.strokeStyle="white";
ctx.setLineDash([10,10]);
ctx.beginPath();
ctx.moveTo(c.width/2,0);
ctx.lineTo(c.width/2,c.height);
ctx.stroke();
ctx.setLineDash([]);

// paddles
ctx.fillStyle="white";
ctx.fillRect(left.x,left.y,left.w,left.h);
ctx.fillRect(right.x,right.y,right.w,right.h);

// ball glow 🔥
ctx.shadowBlur=20;
ctx.shadowColor="cyan";

ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
}

</script>

</body>
</html>
