<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ultra Circle Game ⚪💨</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

canvas{display:block;}

/* UI */
#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
}

button{
padding:10px 15px;
font-size:18px;
border:none;
cursor:pointer;
background:#9b5de5;
color:white;
border-radius:8px;
}

#panel{
margin-top:10px;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:8px;
}
</style>
</head>

<body>

<div id="ui">
<button onclick="toggle()">SCORE</button>
<div id="panel" style="display:none;">
Score: <span id="score">0</span><br>
Boost: <span id="boost">1</span>
</div>
</div>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🎮 player (balle verte)
let ball={
x:200,
y:200,
r:12,
speed:5
};

// 🎮 input
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🔵 cercles
let rings=[];
for(let i=0;i<12;i++) spawn();

function spawn(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:40+Math.random()*25,
color:"white"
});
}

// 💨 fumée violette
let smoke=[];

// 💰 score
let score=0;
let boost=1;

// UI
let show=false;
function toggle(){
show=!show;
document.getElementById("panel").style.display=show?"block":"none";
}

// 🌈 couleur
function randColor(){
return `hsl(${Math.random()*360},100%,60%)`;
}

// 🎮 update
function update(){

// move player
if(keys["ArrowUp"]) ball.y-=ball.speed;
if(keys["ArrowDown"]) ball.y+=ball.speed;
if(keys["ArrowLeft"]) ball.x-=ball.speed;
if(keys["ArrowRight"]) ball.x+=ball.speed;

// limits
ball.x=Math.max(0,Math.min(c.width,ball.x));
ball.y=Math.max(0,Math.min(c.height,ball.y));

// 💨 SMOKE TRAIL
smoke.push({
x:ball.x,
y:ball.y,
size:10,
alpha:0.5
});

// smoke update
for(let i=smoke.length-1;i>=0;i--){
let s=smoke[i];
s.size+=0.6;
s.alpha-=0.02;

if(s.alpha<=0){
smoke.splice(i,1);
}
}

// 🔵 rings
for(let i=rings.length-1;i>=0;i--){
let r=rings[i];

let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r){

// HIT
r.color=randColor();

score += 0.5 * boost;
boost += 0.05;

// remove + respawn
rings.splice(i,1);
spawn();
}
}

// UI update
document.getElementById("score").innerText=score.toFixed(1);
document.getElementById("boost").innerText=boost.toFixed(2);

draw();
requestAnimationFrame(update);
}

// 🎨 draw
function draw(){

// background
ctx.fillStyle="black";
ctx.fillRect(0,0,c.width,c.height);

// 💨 smoke violet
smoke.forEach(s=>{
ctx.fillStyle=`rgba(150,0,255,${s.alpha})`;
ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();
});

// rings
rings.forEach(r=>{
ctx.strokeStyle=r.color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
});

// ball (verte)
ctx.fillStyle="#00ff88";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

// text
ctx.fillStyle="white";
ctx.font="20px Arial";
ctx.fillText("Touch circles = score + boost ⚡",20,30);
}

update();
</script>

</body>
</html>
