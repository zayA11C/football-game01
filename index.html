<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ADDICTIVE RINGS ⚪🔥</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
}
canvas{display:block;}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🌈 fond
let hue=0;

// ⚪ balle
let ball={
x:200,
y:200,
r:10,
speed:5
};

// 🎮 touches
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🔵 cercles
let rings=[];
for(let i=0;i<5;i++) spawnRing();

// 💰 score + combo
let score=0;
let combo=1;
let lastHitTime=0;

// 🔥 vitesse globale
let gameSpeed=1;

// 🎯 spawn cercle
function spawnRing(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:50,
color:"white",
life:3000+Math.random()*2000
});
}

// 🌈 couleur
function randomColor(){
return `hsl(${Math.random()*360},100%,60%)`;
}

// 🎮 update
function update(){

hue+=1;
if(hue>360) hue=0;

// move
if(keys["ArrowUp"]) ball.y-=ball.speed*gameSpeed;
if(keys["ArrowDown"]) ball.y+=ball.speed*gameSpeed;
if(keys["ArrowLeft"]) ball.x-=ball.speed*gameSpeed;
if(keys["ArrowRight"]) ball.x+=ball.speed*gameSpeed;

// limites
ball.x=Math.max(0,Math.min(c.width,ball.x));
ball.y=Math.max(0,Math.min(c.height,ball.y));

// ⏱ combo reset
if(Date.now()-lastHitTime>1200){
combo=1;
}

// 🔵 cercles
rings.forEach((r,i)=>{

r.life-=16;

let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r){

// HIT 🔥
r.color=randomColor();
score+=combo;
combo++;

lastHitTime=Date.now();

// accélération progressive
gameSpeed+=0.03;

// nouveau cercle
rings.splice(i,1);
spawnRing();

// effet satisfaction (flash)
document.body.style.background=`hsl(${hue},50%,8%)`;
}

if(r.life<=0){
rings.splice(i,1);
spawnRing();
}
});

draw();
requestAnimationFrame(update);
}

// 🎨 DRAW
function draw(){

ctx.fillStyle=`hsl(${hue},60%,10%)`;
ctx.fillRect(0,0,c.width,c.height);

// cercles
rings.forEach(r=>{
ctx.strokeStyle=r.color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();

// timer visuel
ctx.strokeStyle="rgba(255,255,255,0.2)";
ctx.beginPath();
ctx.arc(r.x,r.y,r.r+5,0,Math.PI*2);
ctx.stroke();
});

// balle
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

// UI
ctx.fillStyle="white";
ctx.font="28px Arial";
ctx.fillText("Score: "+score,20,40);

ctx.font="22px Arial";
ctx.fillText("Combo x"+combo,20,70);

ctx.font="16px Arial";
ctx.fillText("Speed: "+gameSpeed.toFixed(2),20,100);

ctx.fillText("Arrow keys = move ⚪🔥",20,130);
}

update();
</script>

</body>
</html>
