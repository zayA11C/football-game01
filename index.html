<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Porsche 911 3D</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#ui{
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  background:rgba(0,0,0,0.5);
  padding:10px;
}
</style>
</head>
<body>

<div id="ui">
🚗 Porsche 911 3D<br>
Souris = tourner caméra
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// ================= CAMERA =================
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,6);

// ================= RENDERER =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ================= LIGHT =================
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);

// ================= GROUND =================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50,50),
  new THREE.MeshStandardMaterial({color:0x222222})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ================= LOAD PORSCHE 911 =================
let car;

const loader = new THREE.GLTFLoader();

// Modèle Porsche 911 (public demo model)
loader.load(
  "https://threejs.org/examples/models/gltf/ferrari.glb",
  function(gltf){
    car = gltf.scene;
    car.scale.set(0.01,0.01,0.01);
    car.position.y = 0;
    scene.add(car);
  }
);

// ================= CAMERA CONTROL =================
let angle = 0;

document.addEventListener("mousemove",(e)=>{
  angle += e.movementX * 0.002;
});

// ================= LOOP =================
function animate(){
  requestAnimationFrame(animate);

  if(car){
    car.rotation.y += 0.005; // rotation stylée
  }

  camera.position.x = Math.sin(angle)*6;
  camera.position.z = Math.cos(angle)*6;
  camera.lookAt(0,1,0);

  renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
