<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Interactive Rings ⚪🌈</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
}
canvas{display:block;}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🌈 fond dynamique
let hue=0;

// ⚪ balle contrôlée
let ball={
x:200,
y:200,
r:10,
speed:5
};

// 🎮 touches
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🔵 cercles
let rings=[];
for(let i=0;i<6;i++) spawnRing();

function spawnRing(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:50,
color:"white"
});
}

// 💰 score
let score=0;

// 🎮 update
function update(){

// 🌈 fond change couleur
hue+=0.5;
if(hue>360) hue=0;

// move balle (INTERACTIF)
if(keys["ArrowUp"]) ball.y-=ball.speed;
if(keys["ArrowDown"]) ball.y+=ball.speed;
if(keys["ArrowLeft"]) ball.x-=ball.speed;
if(keys["ArrowRight"]) ball.x+=ball.speed;

// limiter écran
ball.x=Math.max(0,Math.min(c.width,ball.x));
ball.y=Math.max(0,Math.min(c.height,ball.y));

// collision cercles
rings.forEach(r=>{

let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r){
r.color=randomColor();
score++;

// nouveau cercle
setTimeout(()=>{
rings.splice(rings.indexOf(r),1);
spawnRing();
},200);
}

});

draw();
requestAnimationFrame(update);
}

// 🌈 couleur random
function randomColor(){
return `hsl(${Math.random()*360},100%,60%)`;
}

// 🎨 DRAW
function draw(){

// 🌈 fond animé
ctx.fillStyle=`hsl(${hue},60%,10%)`;
ctx.fillRect(0,0,c.width,c.height);

// 🔵 cercles
rings.forEach(r=>{
ctx.strokeStyle=r.color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
});

// ⚪ balle
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

// 💰 score
ctx.fillStyle="white";
ctx.font="30px Arial";
ctx.fillText("Score: "+score,20,40);

// instructions
ctx.font="16px Arial";
ctx.fillText("Arrow keys = move | traverse rings ⚪🌈",20,70);
}

update();
</script>

</body>
</html>
