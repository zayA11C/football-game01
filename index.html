<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Score Boost Game ⚪🔥</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
}

canvas{display:block;}

/* 🎮 UI SCORE */
#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
}

button{
padding:10px 15px;
font-size:18px;
border:none;
cursor:pointer;
background:#ffcc00;
color:black;
border-radius:8px;
}

#panel{
margin-top:10px;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:8px;
}
</style>
</head>

<body>

<div id="ui">
<button onclick="toggleScore()">SCORE</button>

<div id="panel" style="display:none;">
Score: <span id="scoreText">0</span><br>
Boost: <span id="boostText">1</span>
</div>
</div>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🌈 fond
let hue=0;

// ⚪ balle
let ball={
x:200,
y:200,
r:10,
speed:5
};

// 🎮 input
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🔵 cercles
let rings=[];
for(let i=0;i<12;i++) spawnRing();

function spawnRing(){
rings.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:40+Math.random()*25,
color:"white"
});
}

// 💰 score + boost
let score=0;
let boost=1;

// 🔥 panel
let showScore=false;

function toggleScore(){
showScore=!showScore;
document.getElementById("panel").style.display=showScore?"block":"none";
}

// 🌈 couleur
function randomColor(){
return `hsl(${Math.random()*360},100%,60%)`;
}

// 🎮 update
function update(){

hue+=1;

// move
if(keys["ArrowUp"]) ball.y-=ball.speed;
if(keys["ArrowDown"]) ball.y+=ball.speed;
if(keys["ArrowLeft"]) ball.x-=ball.speed;
if(keys["ArrowRight"]) ball.x+=ball.speed;

// limits
ball.x=Math.max(0,Math.min(c.width,ball.x));
ball.y=Math.max(0,Math.min(c.height,ball.y));

// rings
for(let i=rings.length-1;i>=0;i--){
let r=rings[i];

let d=Math.hypot(ball.x-r.x,ball.y-r.y);

if(d<r.r){

// 🎯 BOOST + SCORE
r.color=randomColor();

score += 0.5 * boost;
boost += 0.05;

// remove + respawn
rings.splice(i,1);
spawnRing();
}
}

// UI update
document.getElementById("scoreText").innerText=score.toFixed(1);
document.getElementById("boostText").innerText=boost.toFixed(2);

draw();
requestAnimationFrame(update);
}

// 🎨 draw
function draw(){

ctx.fillStyle=`hsl(${hue},60%,10%)`;
ctx.fillRect(0,0,c.width,c.height);

// rings
rings.forEach(r=>{
ctx.strokeStyle=r.color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
});

// ball
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

// info
ctx.fillStyle="white";
ctx.font="18px Arial";
ctx.fillText("Touch circles = +0.5 boost ⚡",20,120);
}

update();
</script>

</body>
</html>
