<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NEON PONG GOD MODE</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
touch-action:none;
}

/* ===== MENU ===== */
#menu{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(45deg,#000,#111,#220033,#00ffff,#ff00ff);
background-size:400% 400%;
animation:bg 6s infinite alternate;
color:white;
z-index:10;
}

@keyframes bg{
0%{background-position:0% 50%}
100%{background-position:100% 50%}
}

button{
padding:12px 18px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00ffcc;
font-weight:bold;
}

select{
padding:10px;
border-radius:10px;
margin-top:10px;
}

/* HUD */
#hud{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:5;
display:none;
}

/* mobile controls */
#controls{
position:absolute;
bottom:20px;
width:100%;
display:none;
justify-content:space-between;
z-index:5;
}

.pad{
width:45%;
height:120px;
background:rgba(255,255,255,0.05);
}

/* canvas */
canvas{display:block;}
</style>
</head>

<body>

<div id="menu">
<h1>🏓 NEON PONG GOD MODE</h1>

<select id="mode">
<option value="arcade">🎮 Arcade</option>
<option value="pro">🔥 Pro</option>
<option value="chaos">🌀 Chaos+</option>
<option value="impossible">🧠 Impossible AI</option>
</select>

<button onclick="start()">START</button>
</div>

<div id="hud">
Score: <span id="l">0</span> - <span id="r">0</span>
</div>

<div id="controls">
<div class="pad" id="leftPad"></div>
<div class="pad" id="rightPad"></div>
</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

function resize(){
c.width=innerWidth;
c.height=innerHeight;
}
resize();
addEventListener("resize",resize);

// ===== GAME =====
let left,right,ball,particles=[],holes=[];
let scoreL=0,scoreR=0;
let running=false;
let mode="arcade";

let shake=0;
let keys={};

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

// mobile touch
let touchY=0;
document.getElementById("leftPad").addEventListener("touchmove",e=>{
touchY=e.touches[0].clientY;
});

// ===== START =====
function start(){
mode=document.getElementById("mode").value;

document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";
document.getElementById("controls").style.display="flex";

init();
running=true;
loop();
}

// ===== INIT =====
function init(){
left={x:20,y:c.height/2-70,w:15,h:140,s:8};
right={x:c.width-35,y:c.height/2-70,w:15,h:140,s:8};

ball={x:c.width/2,y:c.height/2,vx:7,vy:3,r:8};

scoreL=0;scoreR=0;

// trous noirs
holes=[];
for(let i=0;i<(mode==="chaos"?3:1);i++){
holes.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:60+Math.random()*60
});
}
}

// ===== EXPLOSION =====
function boom(x,y){
for(let i=0;i<25;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*8,
vy:(Math.random()-0.5)*8,
life:40,
hue:Math.random()*360
});
}
shake=15;
}

// ===== IA GOD =====
function ai(){

if(mode!=="impossible" && mode!=="pro") return;

// prédiction ultra avancée
let px=ball.x;
let py=ball.y;
let vx=ball.vx;
let vy=ball.vy;

for(let i=0;i<25;i++){
px+=vx;
py+=vy;

// rebonds prédits
if(py<0||py>c.height) vy*=-1;

// trous noirs perturbent IA
for(let h of holes){
let dx=h.x-px;
let dy=h.y-py;
let d=Math.sqrt(dx*dx+dy*dy);

if(d<h.r){
vy+=dy*0.02;
}
}
}

let target=py-right.h/2;

// difficulté impossible = parfait suivi
let speed = mode==="impossible"?0.28:0.18;

right.y += (target-right.y)*speed;
}

// ===== LOOP =====
function loop(){
if(!running) return;
update();
draw();
requestAnimationFrame(loop);
}

// ===== UPDATE =====
function update(){

// LEFT (player or touch)
if(keys["KeyW"]) left.y-=left.s;
if(keys["KeyS"]) left.y+=left.s;

// mobile
if(touchY) left.y += (touchY-left.y)*0.2;

// IA
ai();

// clamp
left.y=Math.max(0,Math.min(c.height-left.h,left.y));
right.y=Math.max(0,Math.min(c.height-right.h,right.y));

// GRAVITY / CHAOS
if(mode==="chaos"||mode==="impossible"){
ball.vy += 0.15;
ball.vx += (Math.random()-0.5)*0.2;
}

// holes attraction
for(let h of holes){
let dx=h.x-ball.x;
let dy=h.y-ball.y;
let d=Math.sqrt(dx*dx+dy*dy);

if(d<h.r){
ball.vx+=dx*0.02;
ball.vy+=dy*0.02;
}
}

// ball
ball.x+=ball.vx;
ball.y+=ball.vy;

// walls
if(ball.y<0||ball.y>c.height){
ball.vy*=-1;
boom(ball.x,ball.y);
}

// collisions
if(ball.x<left.x+left.w && ball.y>left.y && ball.y<left.y+left.h){
ball.vx*=-1;
boom(ball.x,ball.y);
}

if(ball.x>right.x && ball.y>right.y && ball.y<right.y+right.h){
ball.vx*=-1;
boom(ball.x,ball.y);
}

// score
if(ball.x<0){
scoreR++;reset();
}

if(ball.x>c.width){
scoreL++;reset();
}

// update UI
document.getElementById("l").textContent=scoreL;
document.getElementById("r").textContent=scoreR;
}

// ===== RESET =====
function reset(){
ball.x=c.width/2;
ball.y=c.height/2;
ball.vx=(Math.random()>0.5?7:-7);
ball.vy=(Math.random()-0.5)*6;
}

// ===== DRAW =====
let hue=0;

function draw(){

hue+=3;

// screen shake
let sx=(Math.random()-0.5)*shake;
let sy=(Math.random()-0.5)*shake;
shake*=0.9;

ctx.setTransform(1,0,0,1,sx,sy);

// background
ctx.fillStyle=`hsl(${hue},80%,10%)`;
ctx.fillRect(-sx,-sy,c.width,c.height);

// holes
for(let h of holes){
ctx.beginPath();
ctx.fillStyle="black";
ctx.arc(h.x,h.y,h.r,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="purple";
ctx.stroke();
}

// paddles
ctx.fillStyle="white";
ctx.fillRect(left.x,left.y,left.w,left.h);
ctx.fillRect(right.x,right.y,right.w,right.h);

// ball glow
ctx.shadowBlur=20;
ctx.shadowColor="cyan";

ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

// particles RGB
ctx.shadowBlur=0;
for(let p of particles){
p.x+=p.vx;
p.y+=p.vy;
p.life--;

ctx.fillStyle=`hsl(${p.hue},100%,60%)`;
ctx.fillRect(p.x,p.y,3,3);
}

particles=particles.filter(p=>p.life>0);
}
</script>

</body>
</html>
