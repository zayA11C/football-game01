<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Neon Ping Pong 🏓⚡</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

/* ===== MENU STYLE (comme ton jeu précédent) ===== */
#menu{
position:absolute;
top:0;left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
background:linear-gradient(45deg,#0f0c29,#302b63,#ff00cc,#00ffcc);
background-size:400% 400%;
animation:moveBg 6s infinite alternate;
}

@keyframes moveBg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

button{
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00ffcc;
color:black;
margin-top:10px;
}

/* HUD */
#hud{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:5;
display:none;
font-size:20px;
}

canvas{display:block;}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
<h1>🏓 NEON PING PONG ⚡</h1>
<button onclick="startGame()">START</button>
<p>W/S = gauche | ↑/↓ = droite</p>
</div>

<!-- HUD -->
<div id="hud">
Score Gauche: <span id="scoreL">0</span> |
Score Droite: <span id="scoreR">0</span>
</div>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// 🏓 paddles
let leftPaddle,rightPaddle;

// ⚪ ball
let ball;

// scores
let scoreL=0;
let scoreR=0;

let running=false;

// input
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// ================= START =================
function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";

init();
running=true;
loop();
}

// ================= INIT =================
function init(){

leftPaddle={
x:20,
y:c.height/2-60,
w:15,
h:120,
speed:7
};

rightPaddle={
x:c.width-35,
y:c.height/2-60,
w:15,
h:120,
speed:7
};

ball={
x:c.width/2,
y:c.height/2,
vx:6,
vy:3,
r:8
};

scoreL=0;
scoreR=0;
}

// ================= LOOP =================
function loop(){
if(!running) return;

update();
draw();
requestAnimationFrame(loop);
}

// ================= UPDATE =================
function update(){

// move paddles
if(keys["KeyW"]) leftPaddle.y-=leftPaddle.speed;
if(keys["KeyS"]) leftPaddle.y+=leftPaddle.speed;

if(keys["ArrowUp"]) rightPaddle.y-=rightPaddle.speed;
if(keys["ArrowDown"]) rightPaddle.y+=rightPaddle.speed;

// limits
leftPaddle.y=Math.max(0,Math.min(c.height-leftPaddle.h,leftPaddle.y));
rightPaddle.y=Math.max(0,Math.min(c.height-leftPaddle.h,rightPaddle.y));

// ball move
ball.x+=ball.vx;
ball.y+=ball.vy;

// bounce top/bottom
if(ball.y<0 || ball.y>c.height) ball.vy*=-1;

// collision left
if(
ball.x-ball.r<leftPaddle.x+leftPaddle.w &&
ball.y>leftPaddle.y &&
ball.y<leftPaddle.y+leftPaddle.h
){
ball.vx*=-1;
ball.x=leftPaddle.x+leftPaddle.w+ball.r;
}

// collision right
if(
ball.x+ball.r>rightPaddle.x &&
ball.y>rightPaddle.y &&
ball.y<rightPaddle.y+rightPaddle.h
){
ball.vx*=-1;
ball.x=rightPaddle.x-ball.r;
}

// score
if(ball.x<0){
scoreR++;
resetBall();
}

if(ball.x>c.width){
scoreL++;
resetBall();
}

// UI
document.getElementById("scoreL").innerText=scoreL;
document.getElementById("scoreR").innerText=scoreR;
}

// ================= RESET BALL =================
function resetBall(){
ball.x=c.width/2;
ball.y=c.height/2;
ball.vx*=-1;
ball.vy=(Math.random()-0.5)*6;
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="black";
ctx.fillRect(0,0,c.width,c.height);

// center line
ctx.strokeStyle="white";
ctx.setLineDash([10,10]);
ctx.beginPath();
ctx.moveTo(c.width/2,0);
ctx.lineTo(c.width/2,c.height);
ctx.stroke();
ctx.setLineDash([]);

// paddles
ctx.fillStyle="white";
ctx.fillRect(leftPaddle.x,leftPaddle.y,leftPaddle.w,leftPaddle.h);
ctx.fillRect(rightPaddle.x,rightPaddle.y,rightPaddle.w,rightPaddle.h);

// ball
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

// glow effect
ctx.shadowBlur=15;
ctx.shadowColor="cyan";
ctx.fill();
ctx.shadowBlur=0;
}

</script>

</body>
</html>
