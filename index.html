<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Football Pro ⚽</title>

<style>
body {
  margin: 0;
  background: #1b5e20;
  text-align: center;
  font-family: Arial;
  color: white;
}

canvas {
  background: #2e7d32;
  display: block;
  margin: auto;
  border: 4px solid white;
}
</style>
</head>

<body>

<h2>⚽ Football Pro</h2>
<p>Flèches = bouger | ESPACE = tirer</p>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ⚽ joueurs (style "personnes")
let player = {x:120, y:250};
let enemies = [
  {x:600, y:200},
  {x:650, y:350},
  {x:700, y:150}
];

// ⚽ balle
let ball = {x:140, y:250};
let owned = true;
let speedX = 0;

// 🥅 but
let goal = {x:860, y:200, w:20, h:120};

let score = 0;

// 🎮 contrôles
let keys = {};
document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);

// 🎨 terrain stylé
function drawField(){
  ctx.fillStyle = "#2e7d32";
  ctx.fillRect(0,0,900,500);

  // ligne centrale
  ctx.strokeStyle = "white";
  ctx.beginPath();
  ctx.moveTo(450,0);
  ctx.lineTo(450,500);
  ctx.stroke();

  // cercle centre
  ctx.beginPath();
  ctx.arc(450,250,60,0,Math.PI*2);
  ctx.stroke();

  // surface de but
  ctx.strokeRect(820,150,80,200);
}

// 🔁 update
function update(){

  // mouvement joueur
  if(keys["ArrowUp"]) player.y -= 5;
  if(keys["ArrowDown"]) player.y += 5;
  if(keys["ArrowLeft"]) player.x -= 5;
  if(keys["ArrowRight"]) player.x += 5;

  // tir
  if(keys[" "] && owned){
    owned = false;
    speedX = 9;
  }

  // balle suit joueur
  if(owned){
    ball.x = player.x + 10;
    ball.y = player.y + 10;
  } else {
    ball.x += speedX;
  }

  // 🤖 ennemis suivent balle
  enemies.forEach(e=>{
    if(e.x < ball.x) e.x += 2.5;
    if(e.x > ball.x) e.x -= 2.5;
    if(e.y < ball.y) e.y += 2.5;
    if(e.y > ball.y) e.y -= 2.5;

    // vol balle
    if(Math.hypot(e.x-ball.x,e.y-ball.y)<15){
      owned = false;
    }
  });

  // ⚽ but
  if(ball.x > goal.x && ball.y > goal.y && ball.y < goal.y + goal.h){
    score++;
    player.x = 120;
    player.y = 250;
    owned = true;
    speedX = 0;
  }

  draw();
  requestAnimationFrame(update);
}

// 🎨 dessin "vrais joueurs"
function drawPlayer(x,y,color){
  // tête
  ctx.fillStyle = "#ffcc80";
  ctx.beginPath();
  ctx.arc(x,y,8,0,Math.PI*2);
  ctx.fill();

  // corps
  ctx.fillStyle = color;
  ctx.fillRect(x-5,y+8,10,18);
}

// 🖌️ dessin
function draw(){

  drawField();

  // joueur
  drawPlayer(player.x,player.y,"blue");

  // ennemis
  enemies.forEach(e=>{
    drawPlayer(e.x,e.y,"red");
  });

  // balle
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,5,0,Math.PI*2);
  ctx.fill();

  // but
  ctx.fillStyle = "white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // score
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 20, 30);
}

update();
</script>

</body>
</html>
