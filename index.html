<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football Game ⚽</title>
</head>
<body>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:100, y:250};
let ball = {x:120, y:250};
let ballOwned = true;
let ballSpeedX = 0;

let enemies = [{x:500,y:200},{x:600,y:300}];
let goal = {x:780,y:200,h:100};

let score = 0;

let keys = {};
document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);

function update(){

if(keys["ArrowUp"]) player.y -= 4;
if(keys["ArrowDown"]) player.y += 4;
if(keys["ArrowLeft"]) player.x -= 4;
if(keys["ArrowRight"]) player.x += 4;

if(keys[" "] && ballOwned){
ballOwned = false;
ballSpeedX = 8;
}

if(ballOwned){
ball.x = player.x;
ball.y = player.y;
}else{
ball.x += ballSpeedX;
}

enemies.forEach(e=>{
if(e.x < ball.x) e.x += 2;
if(e.x > ball.x) e.x -= 2;
if(e.y < ball.y) e.y += 2;
if(e.y > ball.y) e.y -= 2;
});

if(ball.x > goal.x){
score++;
player.x=100;player.y=250;
ballOwned=true;
ballSpeedX=0;
}

draw();
requestAnimationFrame(update);
}

function draw(){
ctx.clearRect(0,0,800,500);

ctx.fillStyle="green";
ctx.fillRect(0,0,800,500);

ctx.fillStyle="blue";
ctx.fillRect(player.x,player.y,20,20);

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,6,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="red";
enemies.forEach(e=>{
ctx.fillRect(e.x,e.y,20,20);
});

ctx.fillStyle="white";
ctx.fillText("Score: "+score,20,20);
}

update();
</script>

</body>
</html>
