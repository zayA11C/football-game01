<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm RPG</title>

<style>
body {
    margin: 0;
    background: #111;
    overflow: hidden;
    color: white;
    font-family: Arial;
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 10px;
    border-radius: 8px;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<div id="ui">
    <b>🌾 FARM RPG</b><br>
    💰 Or: <span id="money">0</span><br>
    🌾 Blé: <span id="wheat">0</span><br>
    👇 WASD pour bouger<br>
    E = interagir
</div>

<canvas id="game"></canvas>

<script>

// ---------------- CANVAS ----------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ---------------- PLAYER ----------------
let player = {
    x: 100,
    y: 100,
    size: 20,
    speed: 3
};

// ---------------- GAME STATE ----------------
let game = {
    money: 10,
    wheat: 0
};

// ---------------- NPC ----------------
let npc = {
    x: 300,
    y: 200,
    size: 20,
    text: "Salut fermier ! Appuie sur E"
};

// ---------------- KEYS ----------------
let keys = {};

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// ---------------- MOVE ----------------
function move() {
    if (keys["w"]) player.y -= player.speed;
    if (keys["s"]) player.y += player.speed;
    if (keys["a"]) player.x -= player.speed;
    if (keys["d"]) player.x += player.speed;
}

// ---------------- INTERACTION ----------------
function interact() {
    let dx = player.x - npc.x;
    let dy = player.y - npc.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 50) {
        game.money += 5;
        game.wheat += 2;
        npc.text = "Merci ! +5💰 +2🌾";
        setTimeout(() => {
            npc.text = "Salut fermier ! Appuie sur E";
        }, 2000);
    }
}

document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "e") interact();
});

// ---------------- DRAW ----------------
function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // ground
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // npc
    ctx.fillStyle = "blue";
    ctx.fillRect(npc.x, npc.y, npc.size, npc.size);

    ctx.fillStyle = "white";
    ctx.fillText(npc.text, npc.x - 40, npc.y - 10);

    // player
    ctx.fillStyle = "red";
    ctx.fillRect(player.x, player.y, player.size, player.size);
}

// ---------------- UI ----------------
function updateUI() {
    document.getElementById("money").innerText = game.money;
    document.getElementById("wheat").innerText = game.wheat;
}

// ---------------- LOOP ----------------
function loop() {
    move();
    draw();
    updateUI();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
