<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ping Pong INVINCIBLE AI 🏓⚡</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

/* ===== MENU ===== */
#menu{
position:absolute;
top:0;left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
background:linear-gradient(45deg,#0f0c29,#302b63,#ff00cc,#00ffcc);
background-size:400% 400%;
animation:moveBg 6s infinite alternate;
}

@keyframes moveBg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

button{
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00ffcc;
color:black;
margin-top:10px;
}

label{
color:white;
font-size:16px;
margin:5px;
}

#hud{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:5;
display:none;
}

canvas{display:block;}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
<h1>🏓 INVINCIBLE AI PING PONG ⚡</h1>

<button onclick="startGame()">START</button>

<h3>OPTIONS</h3>

<label><input type="checkbox" id="sound"> 🔊 Sons</label>
<label><input type="checkbox" id="hard"> 🔥 Hard mode (speed++)</label>

<p>W/S = gauche | AI droite 🤖</p>
</div>

<!-- HUD -->
<div id="hud">
Score: <span id="scoreL">0</span> - <span id="scoreR">0</span>
</div>

<canvas id="game"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// ================= GAME =================
let running=false;

let left,right,ball;

let scoreL=0;
let scoreR=0;

let opt={
sound:false,
hard:false
};

// input
let keys={};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// 🔊 sound
function beep(f=600){
if(!opt.sound) return;
let a=new (window.AudioContext||window.webkitAudioContext)();
let o=a.createOscillator();
o.frequency.value=f;
o.connect(a.destination);
o.start();
o.stop(a.currentTime+0.05);
}

// ================= START =================
function startGame(){

opt.sound=document.getElementById("sound").checked;
opt.hard=document.getElementById("hard").checked;

document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";

init();
running=true;
loop();
}

// ================= INIT =================
function init(){

left={
x:20,
y:c.height/2-70,
w:15,
h:140,
speed:8
};

right={
x:c.width-35,
y:c.height/2-70,
w:15,
h:140,
speed:9
};

ball={
x:c.width/2,
y:c.height/2,
vx:7,
vy:3,
r:8
};

scoreL=0;
scoreR=0;
}

// ================= ULTRA IA (IMPOSSIBLE A PERDRE) =================
function ai(){

// suit EXACTEMENT la balle (prediction)
let targetY = ball.y - right.h/2;

// smoothing ultra précis
right.y += (targetY - right.y) * 0.18;

// limite parfaite
right.y=Math.max(0,Math.min(c.height-right.h,right.y));
}

// ================= LOOP =================
function loop(){
if(!running) return;

update();
draw();
requestAnimationFrame(loop);
}

// ================= UPDATE =================
function update(){

// LEFT PLAYER
if(keys["KeyW"]) left.y-=left.speed;
if(keys["KeyS"]) left.y+=left.speed;

left.y=Math.max(0,Math.min(c.height-left.h,left.y));

// AI RIGHT
ai();

// ⚡ HARD MODE SPEED
if(opt.hard){
ball.vx*=1.002;
ball.vy*=1.002;
}

// MOVE BALL
ball.x+=ball.vx;
ball.y+=ball.vy;

// bounce top/bottom
if(ball.y<0 || ball.y>c.height) ball.vy*=-1;

// SPIN EFFECT 🎯
function spin(p){
let diff = ball.y - (p.y + p.h/2);
ball.vy += diff*0.015;
}

// LEFT COLLISION
if(ball.x-ball.r<left.x+left.w &&
ball.y>left.y &&
ball.y<left.y+left.h){

ball.vx*=-1;
spin(left);
ball.x=left.x+left.w+ball.r;
beep(500);
}

// RIGHT COLLISION (AI)
if(ball.x+ball.r>right.x &&
ball.y>right.y &&
ball.y<right.y+right.h){

ball.vx*=-1;
spin(right);
ball.x=right.x-ball.r;
beep(700);
}

// SCORE
if(ball.x<0){
scoreR++;
reset();
beep(200);
}

if(ball.x>c.width){
scoreL++;
reset();
beep(200);
}

// HUD
document.getElementById("scoreL").innerText=scoreL;
document.getElementById("scoreR").innerText=scoreR;
}

// ================= RESET =================
function reset(){
ball.x=c.width/2;
ball.y=c.height/2;
ball.vx=(Math.random()>0.5?7:-7);
ball.vy=(Math.random()-0.5)*6;
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="black";
ctx.fillRect(0,0,c.width,c.height);

// center line
ctx.strokeStyle="white";
ctx.setLineDash([10,10]);
ctx.beginPath();
ctx.moveTo(c.width/2,0);
ctx.lineTo(c.width/2,c.height);
ctx.stroke();
ctx.setLineDash([]);

// paddles
ctx.fillStyle="white";
ctx.fillRect(left.x,left.y,left.w,left.h);
ctx.fillRect(right.x,right.y,right.w,right.h);

// ball glow
ctx.shadowBlur=20;
ctx.shadowColor="cyan";

ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
}

</script>

</body>
</html>
